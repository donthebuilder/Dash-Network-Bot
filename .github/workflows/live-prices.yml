name: Live price log (price at the moment they hit)

# Polls Kalshi's live per-player markets every minute through the evening's games and keeps every price CHANGE (bots/live_price_log.py), so a settled market can be
# read back as: price pregame, at the start, and in the minutes before the player actually hit. NBA points + NHL goals are joined to the play-by-play in the report; rebounds,
# assists, PRA, NHL points / assists and NFL anytime TD ticks are kept for later grading. Own schedule, own job; writes to `bbe-history` every 30 minutes.
on:
  schedule:
    # SLOT GATE (2026-11-05): each ET slot is listed at its EDT and its EST hour; .github/scripts/slot_gate.py keeps the one that matches today's clock.
    - cron: '45 22 * * *'
    - cron: '45 23 * * *'
    - cron: '15 4 * * *'
    - cron: '15 5 * * *'
    - cron: '15 15 * * 0'
    - cron: '15 16 * * 0'
    - cron: '45 20 * * 0'
    - cron: '45 21 * * 0'
    - cron: '20 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: "the cron line this run stands in for (the Vercel restarter sets it)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: live-prices
  cancel-in-progress: false

jobs:
  # SLOT GATE (2026-11-05): the other season's twin slot exits; no game check (this job polls during the games).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts
      - id: g
        env:
          SLOT: ${{ github.event.schedule || inputs.slot }}
        run: python3 .github/scripts/slot_gate.py --want "18:45,00:15,11:15,16:45,07:20,08:20"

  poll:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout the bbe-history branch (read/write)
        run: |
          git config --global user.name  "moonshot-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch bbe-history "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _data
          # only the folder this job writes is downloaded (known-issues #107): the branch is ~1.5 GB and most of it is bbe_history/
          git -C _data sparse-checkout set public/data/current/live_prices
          mkdir -p _data/public/data/current/live_prices
      - name: Poll through the games, push every 30 minutes (evening runs) / report (morning run)
        run: |
          D=_data/public/data/current/live_prices
          H=$(date -u +%H); DOW=$(date -u +%u)
          if [ "$H" = "12" ]; then
            python3 bots/live_price_log.py report $D || true
          else
            SERIES="KXNBAPTS KXNBAREB KXNBAAST KXNBAPRA KXNHLGOAL KXNHLPTS KXNHLAST"
            # MLB series only on an MLB day (2026-11-05, LEFTOVERS B8; fails open: an unreadable schedule keeps them)
            G=$(python3 bots/mlb_season_guard.py --back 0 --ahead 0 || true); case "$G" in *active=true*) SERIES="$SERIES KXMLBHR KXMLBHIT KXMLBTB" ;; esac
            if [ "$DOW" = "7" ] || [ "$DOW" = "1" ] || [ "$DOW" = "4" ]; then SERIES="$SERIES KXNFLANYTD"; fi
            # every evening run polls in 30-min chunks until 2:30 am ET (2026-11-05: the late 00:xx ET slot picks up
            # where the 18:xx run's 5.5 h cap ends, so West Coast games are covered; a queued run past 2:30 exits)
            for i in $(seq 1 11); do
              ETHM=$(TZ=America/New_York date +%H%M); if [ $((10#$ETHM)) -ge 230 ] && [ $((10#$ETHM)) -lt 1100 ]; then echo "past 2:30 am ET: done"; break; fi
              python3 bots/live_price_log.py loop $D --minutes 30 --every 60 --series $SERIES || true
              (cd _data && git add public/data/current/live_prices && { git diff --cached --quiet || { git commit -qm "live prices $(date -u +%FT%H%MZ)"; for j in 1 2 3 4 5; do git pull -q --rebase origin bbe-history && git push -q origin HEAD:bbe-history && break; sleep $((j * 5)); done; }; })
            done
          fi
      - name: Commit the report
        if: always()
        working-directory: _data
        run: |
          git add public/data/current/live_prices
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -qm "live prices report $(date -u +%FT%H%MZ)"
            for j in 1 2 3 4 5; do git pull -q --rebase origin bbe-history && git push -q origin HEAD:bbe-history && break; sleep $((j * 5)); done
          fi
