name: NFL fantasy stats (FRANCHISE live scoring)

# WHY THIS IS SEPARATE FROM nfl.yml (2026-09-14)
#
# FRANCHISE scores a week off a per-player box-score line that this repo
# never published -- every player scored 0 for all of Week 1. nfl.yml is the
# right home for the model, not for live scoring: it rebuilds the whole slate
# (~minutes, nflverse cache, seven models) about five times on a Sunday, and
# a fantasy score that moves five times a day is not live.
#
# This job does one thing: ESPN summary -> nfl_fantasy_stats.json, in
# seconds, with `requests` as its only dependency, every 15 minutes inside
# the windows a football game can be on. The site's /api/fantasy/scoring
# (called every 10 min by dash-endpoints.yml) merges the file over the slate.
#
# Best-effort cadence, same caveat as dash-endpoints.yml: GitHub often runs a
# few minutes late and can skip a busy slot. A skipped run costs 15 minutes
# of staleness, never a wrong number -- the next run republishes the full
# week, not a diff.

on:
  schedule:
    # Phoenix is UTC-7 year-round. Windows, in UTC:
    #   Thu night (TNF)   Fri 00:00-05:59Z
    #   Sat (late season) Sat 17:00-23:59Z + Sun 00:00-05:59Z
    #   Sunday            Sun 17:00-23:59Z + Mon 00:00-05:59Z
    #   Mon night (MNF)   Tue 00:00-05:59Z
    # Sunday from 13:00 UTC (2026-10-04 game-day check: IND@WAS kicked off 13:30Z
    # in London and the box stayed at its 10:04Z pre-game build until 17:00).
    - cron: '7,22,37,52 13-23 * * 0'
    - cron: '7,22,37,52 17-23 * * 6'
    # off the quarter-hours (2026-10-04: GitHub started none of the */15 runs
    # 16:31-17:50 on a Sunday; its scheduler drops most at :00/:15/:30/:45)
    - cron: '7,22,37,52 0-5 * * 0,1,2,5'
    # THE CLOSE-OUT PASSES (2026-11-15). The slate rolls to next week Tue
    # 13:00Z and the site only merges the live file when its week is the
    # slate's, so a Monday night game that went final after the last run above
    # used to be lost for good (FRANCHISE weeks 4, 5, 6, 8, 9). The site now
    # closes an old week from that week's OWN file
    # (nfl_fantasy_stats_<season>_wNN.json), which every run writes and which
    # a run on the following week finishes if it is still open. These slots
    # make sure one such run happens soon after Monday night instead of waiting
    # for Thursday: Tue (ESPN is still on the old week) and Wed + Thu (ESPN
    # has rolled; the run finishes last week's file). Three slots because
    # GitHub drops most scheduled runs of this workflow.
    - cron: '37 9,15 * * 2'
    - cron: '37 15 * * 3,4'
  workflow_dispatch:
    inputs:
      week:
        description: "regular-season week (blank = ESPN's current week)"
        required: false
        default: ""

concurrency:
  group: nfl-fantasy-stats
  cancel-in-progress: false

permissions:
  contents: write

env:
  # seal move 3: the data branch holds only sealed copies of the files that name tonight's calls; every step that
  # reads or publishes the branch needs the key (open_data_branch.sh, bots/sealed_data.py, publish_data.sh)
  DATA_SEAL_KEY: ${{ secrets.DATA_SEAL_KEY }}

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Build fantasy stats
        run: |
          set -euo pipefail
          ARGS="--season 2026"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          fi
          cd bots/nfl && python nfl_fantasy_stats.py $ARGS --out "$GITHUB_WORKSPACE/public/data/current"

      - name: Publish to data branch
        run: bash .github/scripts/publish_data.sh "NFL fantasy stats"
