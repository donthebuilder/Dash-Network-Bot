# 🧠⚖️🔬 Accountability — memory nightly, verdicts weekly.
#
# 2026-08-09. Three jobs that all read the same thing (the graded archive) and
# write small files back to the data branch:
#
#   season_memory.py     NIGHTLY, after grading. The site's memory — streaks,
#                        droughts, rolling form, how each park has actually
#                        played. Folded here so the browser fetches one ~45 KB
#                        file instead of forty graded files.
#   validate_context.py  WEEKLY. The cron behind the two-lane rule: which
#                        context stats have earned a place in the scoring.
#   autopsy.py           WEEKLY. The three worst misses and what the model was
#                        looking at when it made them.
#
# Memory runs nightly because it's what the site reads; the two verdict jobs
# run weekly because a daily verdict on a 12%-base-rate outcome is noise with a
# schedule. Both post to Discord.
#
# stdlib only — no pip install, so a run is seconds of compute.
name: Accountability

on:
  workflow_dispatch:
    inputs:
      which:
        description: 'memory | weekly | both'
        required: false
        default: 'both'
  schedule:
    # OFF THE HOUR (2026-09-27): GitHub drops scheduled runs under load, worst at
    # :00 and :30 (09-25: results ran 7 of ~64 slots, today 11 of 24). Minutes
    # moved 3-7 later; the Vercel dispatcher (/api/gh/dispatch) backs them up.
    # 09:20 UTC = 5:20am ET — after the nightly grading run has settled.
    - cron: '20 9 * * *'
    # Mondays 14:00 UTC = 10am ET, for the weekly verdicts.
    - cron: '4 14 * * 1'

permissions:
  contents: write

concurrency:
  group: accountability
  cancel-in-progress: false

env:
  # seal move 3: the data branch holds only sealed copies of the files that name tonight's calls; every step that
  # reads or publishes the branch needs the key (open_data_branch.sh, bots/sealed_data.py, publish_data.sh)
  DATA_SEAL_KEY: ${{ secrets.DATA_SEAL_KEY }}

jobs:
  guard:
    # OFFSEASON GUARD (bots/mlb_season_guard.py; added here 2026-11-09, L4): no MLB game from
    # 8 day(s) back to 3 ahead -> the job below skips (8 back keeps the nightly memory and one Monday verdict running after the last game). It re-checks the graded
    # MLB archive, which does not change until games return; its last files stay on the data
    # branch (publish_data.sh carry_forward keeps them). Postseason counts; a hand-started run
    # always goes; an unreadable schedule fails OPEN. Resumes on its own in March.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.g.outputs.active }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bots/mlb_season_guard.py
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 bots/mlb_season_guard.py --back 8 --ahead 3

  run:
    needs: [guard]
    if: ${{ needs.guard.outputs.active == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1

      - name: Bring in the scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _src
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The scripts resolve paths from their own location, so they're copied
      # next to the data rather than run out of _src.
      #
      # ── EVERY .py, NOT A HAND-PICKED FOUR (fixed 2026-08-23) ──────────────
      # This copied exactly the four entry points by name. Three of them open
      # with `from archive import rows_of` — archive.py was never in the list,
      # and `rm -rf _src` on the next line deleted the only other copy. So
      # season_memory.py (NIGHTLY), validate_context.py and autopsy.py have
      # died on ModuleNotFoundError on every run since this workflow was
      # written on 2026-08-09, and public/data/current/season_memory.json has
      # never existed on the data branch. The job went red nightly and nobody
      # was reading the run list.
      #
      # A cp list that has to be kept in step with an import graph is a trap
      # that resets every time a script gains a helper. Copying the whole
      # directory has no such failure mode, costs nothing (35 small files),
      # and the Publish step below stages three explicit JSON paths, so no .py
      # can ever be committed to the data branch by accident.
      - name: Stage
        run: |
          mkdir -p bots
          cp _src/bots/*.py bots/
          cp _src/.github/scripts/push_data_files.sh /tmp/push_data_files.sh
          rm -rf _src
          python -c "import ast,sys,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('bots').glob('*.py')]" 

      - name: Season memory
        if: github.event_name == 'schedule' || github.event.inputs.which != 'weekly'
        run: python bots/season_memory.py

      # Weekly work runs on the Monday cron, or on demand.
      - name: Is this the weekly slot?
        id: weekly
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ github.event.inputs.which }}" != "memory" ] && echo "go=yes" >> $GITHUB_OUTPUT || true
          elif [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "14" ]; then
            echo "go=yes" >> $GITHUB_OUTPUT
          fi

      - name: Two-lane validation
        if: steps.weekly.outputs.go == 'yes'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
        run: python bots/validate_context.py

      # Answers "which ordering actually put the homers on top" against the
      # whole archive, so the raw-vs-adjusted question stays settled by data
      # rather than by whoever last had an opinion about it.
      - name: Score shootout
        if: steps.weekly.outputs.go == 'yes'
        run: python bots/score_shootout.py

      - name: Autopsy
        if: steps.weekly.outputs.go == 'yes'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bots/autopsy.py --days 7

      - name: Publish
        run: |
          rm -rf bots
          git config user.name  "moonshot-bot"
          git config user.email "bot@users.noreply.github.com"
          bash /tmp/push_data_files.sh "accountability: memory + verdicts $(date -u +%F)" \
            public/data/current/season_memory.json public/data/current/context_validation.json public/data/current/autopsy_latest.json
