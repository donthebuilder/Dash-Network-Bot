name: Live edge log (live moneylines, spreads - paper trading)

# Through every game, compares Kalshi's LIVE moneyline / spread markets with our fair number from the live game state (bots/live_edge.py: NBA and NFL from the live-spread table, NHL by Poisson)
# and logs every price that is at least 4 points off after fees. Nothing is bet. The morning report settles each alert against the final score and shows whether taking them would have paid.
# Starts before the first tip / puck drop / kickoff so the pregame line of every game is cached before ESPN drops it. Own schedule; writes to `bbe-history` every 30 minutes.
on:
  schedule:
    # SLOT GATE (2026-11-05): each ET slot is listed at its EDT and its EST hour; .github/scripts/slot_gate.py keeps the one that matches today's clock.
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 16 * * 0'
    - cron: '0 17 * * 0'
    - cron: '30 21 * * 0'
    - cron: '30 22 * * 0'
    - cron: '40 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: "the cron line this run stands in for (the Vercel restarter sets it)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: live-edge
  cancel-in-progress: false

jobs:
  # SLOT GATE (2026-11-05): the other season's twin slot exits; no game check (this job polls during the games).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts
      - id: g
        env:
          SLOT: ${{ github.event.schedule || inputs.slot }}
        run: python3 .github/scripts/slot_gate.py --want "18:30,00:00,12:00,17:30,07:40,08:40"

  edge:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy requests nflreadpy polars
      - name: Checkout the bbe-history branch (read/write)
        run: |
          git config --global user.name  "moonshot-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch bbe-history "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _data
          # only the folder this job writes is downloaded (known-issues #107): the branch is ~1.5 GB and most of it is bbe_history/
          git -C _data sparse-checkout set public/data/current/live_edges
          mkdir -p _data/public/data/current/live_edges
      - name: Poll through the games (evening) / settle and report (morning)
        run: |
          D=_data/public/data/current/live_edges
          H=$(date -u +%H)
          if [ "$H" = "12" ]; then
            python3 bots/live_edge.py report $D || true
          else
            # every evening run polls in 30-min chunks until 2:30 am ET (2026-11-05: the late 00:xx ET slot picks up
            # where the 18:xx run's 5.5 h cap ends, so West Coast games are covered; a queued run past 2:30 exits)
            for i in $(seq 1 11); do
              ETHM=$(TZ=America/New_York date +%H%M); if [ $((10#$ETHM)) -ge 230 ] && [ $((10#$ETHM)) -lt 1100 ]; then echo "past 2:30 am ET: done"; break; fi
              python3 bots/live_edge.py loop $D --minutes 30 --every 45 || true
              (cd _data && git add public/data/current/live_edges && { git diff --cached --quiet || { git commit -qm "live edges $(date -u +%FT%H%MZ)"; for j in 1 2 3 4 5; do git pull -q --rebase origin bbe-history && git push -q origin HEAD:bbe-history && break; sleep $((j * 5)); done; }; })
            done
          fi
      - name: Commit
        if: always()
        working-directory: _data
        run: |
          git add public/data/current/live_edges
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -qm "live edges report $(date -u +%FT%H%MZ)"
            for j in 1 2 3 4 5; do git pull -q --rebase origin bbe-history && git push -q origin HEAD:bbe-history && break; sleep $((j * 5)); done
          fi
