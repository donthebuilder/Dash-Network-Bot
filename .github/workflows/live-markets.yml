name: Live markets (live prices + live edge, one runner)

# ONE RUNNER (2026-11-09, L4). live-prices.yml and live-edge.yml polled through the same evening windows on two runners and were 94% of the
# repo's Actions minutes (13,931 of 14,817 in the week to 11-09). They now run here as two background loops on ONE runner, each writing and
# pushing exactly what it did before (its own sparse clone of `bbe-history`, its own folder, its own commits every 30 minutes):
#   live prices  bots/live_price_log.py: Kalshi's live per-player markets every 60 s, every price CHANGE kept (price_ticks / price_meta). NBA points
#                + NHL goals are joined to the play-by-play in the morning report; rebounds, assists, PRA, NHL points / assists and NFL anytime TD
#                ticks are kept for later grading.
#   live edge    bots/live_edge.py: Kalshi's live moneyline / spread / total markets every 45 s against our fair number from the live game state;
#                every price at least 4 points off after fees is logged (alerts). Nothing is bet. Starts before the first tip / puck drop /
#                kickoff so each game's pregame line is cached before ESPN drops it.
# The slots are the earlier of the two old ones (live edge 18:30 / 00:00 / Sun 12:00 / Sun 17:30 / 07:40, live prices 18:45 / 00:15 / Sun 11:15 /
# Sun 16:45 / 07:20), so each loop starts no later than it used to: nothing is polled less than before.
# The live-edge loop ends for the night once no game is in progress and none is left to start before 2:30 am ET (--stop-when-done; it logs only
# games in progress). The live-prices loop keeps going to 2:30 am ET: after the last game it still records price changes on the next day's
# markets, so stopping it early would drop real ticks.
on:
  schedule:
    # SLOT GATE (2026-11-05): each ET slot is listed at its EDT and its EST hour; .github/scripts/slot_gate.py keeps the one that matches today's clock.
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '15 15 * * 0'
    - cron: '15 16 * * 0'
    - cron: '45 20 * * 0'
    - cron: '45 21 * * 0'
    - cron: '20 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: "the cron line this run stands in for (the Vercel restarter sets it)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: live-markets
  cancel-in-progress: false

env:
  # seal move 3: the data branch holds only sealed copies of the files that name tonight's calls; every step that
  # reads or publishes the branch needs the key (open_data_branch.sh, bots/sealed_data.py, publish_data.sh)
  DATA_SEAL_KEY: ${{ secrets.DATA_SEAL_KEY }}

jobs:
  # SLOT GATE (2026-11-05): the other season's twin slot exits; no game check (this job polls during the games).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts
      - id: g
        env:
          SLOT: ${{ github.event.schedule || inputs.slot }}
        run: python3 .github/scripts/slot_gate.py --want "18:30,00:00,11:15,16:45,07:20,08:20"

  live:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy requests nflreadpy polars
      - name: Checkout the bbe-history branch twice (read/write), one folder each
        run: |
          git config --global user.name  "moonshot-bot"
          git config --global user.email "bot@users.noreply.github.com"
          # two clones, not one: each loop commits / rebases / pushes on its own clock, and a rebase refuses while the other loop is mid-write
          # only the folder each loop writes is downloaded (known-issues #107): the branch is ~1.5 GB and most of it is bbe_history/
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch bbe-history "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _prices
          git -C _prices sparse-checkout set public/data/current/live_prices
          mkdir -p _prices/public/data/current/live_prices
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch bbe-history "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _edge
          git -C _edge sparse-checkout set public/data/current/live_edges
          mkdir -p _edge/public/data/current/live_edges
      - name: Morning reports (settle and report)
        if: ${{ !cancelled() }}
        run: |
          [ "$(date -u +%H)" = "12" ] || { echo "evening run: no reports"; exit 0; }
          python3 bots/live_edge.py report _edge/public/data/current/live_edges || true
          # 2026-11-09: no `|| true` any more. The report crashed on every run (NHL play times) behind it and never wrote live_price_report.json;
          # a crash now shows red. Nothing is lost by it: the commit step below runs either way.
          python3 bots/live_price_log.py report _prices/public/data/current/live_prices
      - name: Poll through the games, push every 30 minutes (evening runs)
        run: |
          [ "$(date -u +%H)" != "12" ] || { echo "morning run: reports only"; exit 0; }
          DOW=$(date -u +%u)
          SERIES="KXNBAPTS KXNBAREB KXNBAAST KXNBAPRA KXNHLGOAL KXNHLPTS KXNHLAST"
          # MLB series only on an MLB day (2026-11-05, LEFTOVERS B8; fails open: an unreadable schedule keeps them)
          G=$(python3 bots/mlb_season_guard.py --back 0 --ahead 0 || true); case "$G" in *active=true*) SERIES="$SERIES KXMLBHR KXMLBHIT KXMLBTB" ;; esac
          if [ "$DOW" = "7" ] || [ "$DOW" = "1" ] || [ "$DOW" = "4" ]; then SERIES="$SERIES KXNFLANYTD"; fi
          # every evening run polls in 30-min chunks until 2:30 am ET (2026-11-05: the late 00:xx ET slot picks up
          # where the 18:xx run's 5.5 h cap ends, so West Coast games are covered; a queued run past 2:30 exits)
          past_230() { ETHM=$(TZ=America/New_York date +%H%M); [ $((10#$ETHM)) -ge 230 ] && [ $((10#$ETHM)) -lt 1100 ]; }
          push() {   # clone folder message
            (cd "$1" && git add "public/data/current/$2" && { git diff --cached --quiet || { git commit -qm "$3 $(date -u +%FT%H%MZ)"; for j in 1 2 3 4 5; do git pull -q --rebase origin bbe-history && git push -q origin HEAD:bbe-history && break; sleep $((j * 5)); done; }; })
          }
          prices() {
            for i in $(seq 1 11); do
              if past_230; then echo "past 2:30 am ET: done"; break; fi
              python3 bots/live_price_log.py loop _prices/public/data/current/live_prices --minutes 30 --every 60 --series $SERIES || true
              push _prices live_prices "live prices"
            done
          }
          edge() {
            for i in $(seq 1 11); do
              if past_230; then echo "past 2:30 am ET: done"; break; fi
              rc=0; python3 bots/live_edge.py loop _edge/public/data/current/live_edges --minutes 30 --every 45 --stop-when-done || rc=$?
              push _edge live_edges "live edges"
              if [ "$rc" = "3" ]; then echo "every game tonight is final: done"; break; fi
            done
          }
          prices 2>&1 | sed -u 's/^/[prices] /' &
          edge 2>&1 | sed -u 's/^/[edge] /' &
          wait
      - name: Commit what is left
        if: always()
        run: |
          for x in "_prices live_prices live prices report" "_edge live_edges live edges report"; do
            set -- $x; dir=$1; folder=$2; shift 2
            [ -d "$dir" ] || continue
            (cd "$dir" && git add "public/data/current/$folder" && if git diff --cached --quiet; then echo "$folder: nothing changed"; else
              git commit -qm "$* $(date -u +%FT%H%MZ)"
              for j in 1 2 3 4 5; do git pull -q --rebase origin bbe-history && git push -q origin HEAD:bbe-history && break; sleep $((j * 5)); done
            fi)
          done
